<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>โปรแกรมคำนวณเฉลี่ยการใช้ไฟฟ้า</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  font-family:'Kanit',sans-serif;
  background:
    radial-gradient(circle at top left, rgba(213,171,1,0.18), transparent 25%),
    radial-gradient(circle at bottom right, rgba(168,85,247,0.15), transparent 25%),
    linear-gradient(135deg,#300746,#4b0b7c,#7b2fb6);
  min-height:100vh;
  padding:40px 20px;
  color:#fff;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:40px;
  border-radius:32px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:
    0 10px 40px rgba(0,0,0,0.35),
    inset 0 1px 1px rgba(255,255,255,0.08);
}
h1{
  text-align:center;
  font-size:38px;
  margin-bottom:35px;
  background:linear-gradient(
    135deg,
    #fde68a,
    #facc15,
    #fff7ed
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:28px;
  padding:28px;
  margin-bottom:25px;
}
.card h2{
  color:#facc15;
  margin-bottom:20px;
}
label{
  display:block;
  margin-bottom:8px;
  margin-top:15px;
  color:#f5f3ff;
}
input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  background:rgba(255,255,255,0.95);
  color:#2e1065;
  font-size:16px;
  font-family:'Kanit',sans-serif;
  outline:none;
}
input:focus{
  box-shadow:
    0 0 0 3px rgba(250,204,21,0.3);
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
table th{
  background:rgba(250,204,21,0.15);
  color:#fde68a;
  padding:15px;
  border:1px solid rgba(255,255,255,0.1);
}
table td{
  padding:10px;
  border:1px solid rgba(255,255,255,0.08);
}
table input{
  margin:0;
}
.button-group{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-top:25px;
}
button{
  flex:1;
  padding:16px;
  border:none;
  border-radius:18px;
  cursor:pointer;
  font-family:'Kanit',sans-serif;
  font-size:17px;
  font-weight:600;
  transition:.3s;
}
.calc-btn{
  background:linear-gradient(
    135deg,
    #fde68a,
    #facc15
  );
  color:#3b0764;
}
.calc-btn:hover{
  transform:translateY(-3px);
}
.add-btn{
  background:linear-gradient(
    135deg,
    #8b5cf6,
    #a855f7
  );
  color:white;
}
.add-btn:hover{
  transform:translateY(-3px);
}
.back-btn{
  background:rgba(255,255,255,0.1);
  color:white;
  border:1px solid rgba(255,255,255,0.15);
}
.back-btn:hover{
  background:rgba(255,255,255,0.2);
}
.result{
  display:none;
  margin-top:30px;
  background:
    linear-gradient(
      135deg,
      rgba(255,248,220,0.98),
      rgba(255,255,255,0.95)
    );
  color:#3b0764;
  padding:30px;
  border-radius:24px;
}
.result h3{
  margin-bottom:20px;
}
.result p{
  margin:10px 0;
  font-size:18px;
}
.total{
  font-size:32px;
  font-weight:700;
  color:#b45309;
  margin-top:15px;
}
@media(max-width:768px){
  .container{
    padding:20px;
  }
  h1{
    font-size:28px;
  }
  .button-group{
    flex-direction:column;
  }
}
.bill-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  color:#111827;
  margin-top:15px;
}
.bill-table th{
  background:#e5e7eb;
  color:#111827;
  padding:12px;
  border:1px solid #d1d5db;
}
.bill-table td{
  padding:10px;
  border:1px solid #d1d5db;
}
.bill-table .section{
  background:#f3f4f6;
  font-weight:700;
}
.bill-table .total-row{
  background:#d9f99d;
  font-weight:700;
  font-size:20px;
}
.amount{
  text-align:right;
}
</style>
<script>
function calculate1115(){
  const units =
    parseFloat(document.getElementById('units').value) || 0;
  const ft =
    parseFloat(document.getElementById('ft').value) || 0;
  const service = 8.19;
  let remain = units;
  const rates = [
    {limit:15, rate:2.3488, label:"15 หน่วยแรก (หน่วยที่ 0-15)"},
    {limit:10, rate:2.9882, label:"10 หน่วยต่อไป (หน่วยที่ 16-25)"},
    {limit:10, rate:3.2405, label:"10 หน่วยต่อไป (หน่วยที่ 26-35)"},
    {limit:65, rate:3.6237, label:"65 หน่วยต่อไป (หน่วยที่ 36-100)"},
    {limit:50, rate:3.7171, label:"50 หน่วยต่อไป (หน่วยที่ 101-150)"},
    {limit:250, rate:4.2218, label:"250 หน่วยต่อไป (หน่วยที่ 151-400)"},
    {limit:999999, rate:4.4217, label:"เกินกว่า 400 หน่วย"}
  ];
  let baseCost = 0;
  let detailRows = "";
  rates.forEach(item=>{
    if(remain<=0) return;
    const used =
      Math.min(remain,item.limit);
    const amount =
      used * item.rate;
    baseCost += amount;
    detailRows += `
      <tr>
        <td>${item.label}</td>
        <td>= (${used} × ${item.rate})</td>
        <td class="amount">${amount.toFixed(2)}</td>
      </tr>
    `;
    remain -= used;
  });
  const baseWithService =
    baseCost + service;
  const ftCost =
    units * ft;
  const vat =
    (baseWithService + ftCost) * 0.07;
  const total =
    baseWithService + ftCost + vat;
  document.getElementById("result").innerHTML = `
  <h3>
    ประเภทอัตรา 10 บ้านอยู่อาศัย อัตรา 1115
  </h3>

  <table class="bill-table">
    <tr>
      <td>พลังงานไฟฟ้า (หน่วย)</td>
      <td class="amount">${units.toFixed(2)}</td>
      <td>หน่วย/เดือน</td>
    </tr>
    <tr>
      <td>ค่า Ft</td>
      <td class="amount">${ft.toFixed(4)}</td>
      <td>บาท/หน่วย</td>
    </tr>
    <tr class="section">
      <td colspan="3">
        ส่วนที่ 1 ค่าไฟฟ้าฐาน
      </td>
    </tr>
    ${detailRows}
    <tr>
      <td colspan="2">
        รวม
      </td>
      <td class="amount">
        ${baseCost.toFixed(2)}
      </td>
    </tr>
    <tr>
      <td colspan="2">
        ค่าบริการ
      </td>
      <td class="amount">
        8.19
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <b>รวมค่าไฟฟ้าฐาน</b>
      </td>
      <td class="amount">
        <b>${baseWithService.toFixed(2)}</b>
      </td>
    </tr>
    <tr class="section">
      <td colspan="3">
        ส่วนที่ 2 ค่าไฟฟ้าผันแปร (Ft)
      </td>
    </tr>
    <tr>
      <td>จำนวนพลังงานไฟฟ้า × Ft</td>
      <td>
        ${units.toFixed(0)}
        ×
        ${ft.toFixed(4)}
      </td>
      <td class="amount">
        ${ftCost.toFixed(2)}
      </td>
    </tr>
    <tr class="section">
      <td colspan="3">
        ส่วนที่ 3 ภาษีมูลค่าเพิ่ม 7%
      </td>
    </tr>
    <tr>
      <td>(${baseWithService.toFixed(2)} + ${ftCost.toFixed(2)}) × 7%</td>
      <td></td>
      <td class="amount">
        ${vat.toFixed(2)}
      </td>
    </tr>
    <tr class="total-row">
      <td colspan="2">
        รวมเงินค่าไฟฟ้า
      </td>
      <td class="amount">
        ${total.toFixed(2)} บาท
      </td>
    </tr>
  </table>
  `;
  document.getElementById("result").style.display = "block";
}
</script>
<body>
<div class="container">
  <h1>คำนวณค่าไฟฟ้า อัตรา 1115</h1>
  <div class="card">
    <label>พลังงานไฟฟ้า (หน่วย)</label>
    <input type="number" id="units">
    <label>ค่า Ft (บาท/หน่วย)</label>
    <input type="number" step="0.0001" id="ft">
  </div>
</div>
<div class="button-group">
  <button class="calc-btn" onclick="calculate1115()">
    คำนวณค่าไฟ
  </button>
  <button class="back-btn"
          onclick="window.location.href='index.html'">
    กลับหน้าหลัก
  </button>
</div>
<div id="result" class="result"></div>
